spring.application.name=ai-call-crm
# Local development: values in backend/.env (git-ignored) are loaded if the file exists.
# In production, set real environment variables instead.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mbbs_crm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Jackson 3 rejects absent primitive fields by default; treat an omitted boolean as false instead.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ---- Auth ----
# JWT_SECRET has no default on purpose: the app refuses to start without one (min 32 bytes).
app.jwt.secret=${JWT_SECRET:}
# Sessions end after 3 minutes without activity. The browser renews the session about once a minute while
# the person is active (see frontend/src/lib/use-idle.tsx, which must use the same limit); a closed tab or a
# sleeping laptop simply lets the refresh token run out. Keep access-ttl no longer than refresh-ttl.
app.jwt.access-ttl=${SESSION_IDLE_TIMEOUT:3m}
app.jwt.refresh-ttl=${SESSION_IDLE_TIMEOUT:3m}
app.cookie.secure=${COOKIE_SECURE:true}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Super Admin}
# The first admin's mobile number: staff sign in with their number and a one-time code.
app.bootstrap.admin-phone=${ADMIN_PHONE:}
# TEMPORARY, until SMS is connected: show the sign-in code on the login page instead of sending it.
# While true, anyone who knows a staff mobile number can sign in. Never true on a public site.
app.otp.show-on-screen=${OTP_SHOW_ON_SCREEN:false}
# Sign-in codes by SMS through this customer's own MSG91 account (blank: no SMS). The template is the
# DLT-approved one under MSG91 SMS > Templates, with the code in a variable (##OTP##). docs/new-customer-setup.md
app.otp.sms.provider=${OTP_SMS_PROVIDER:}
app.otp.sms.auth-key=${MSG91_AUTH_KEY:}
app.otp.sms.template-id=${MSG91_OTP_TEMPLATE_ID:}
app.otp.sms.otp-variable=${MSG91_OTP_VARIABLE:OTP}
app.otp.sms.api-base=${MSG91_API_BASE:https://control.msg91.com/api/v5}

# ---- What this customer has bought ----
# Comma-separated modules that are switched on: AI_CALLS, IMPORT, EXPORT, FOLLOW_UPS, or ALL.
# Set by you (the seller) per installation, not by the customer's admin.
app.features=${FEATURES:ALL}

# ---- Ops ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Contact imports (Excel / CSV).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB


# ---- AI voice calling agent (spec section 18) ----
# With no platform connected ("simulated") everything works except that no phone rings.
app.voice.enabled=${VOICE_ENABLED:true}
# Name of the installed VoicePlatformClient adapter to use; see docs/voice-agent.md.
app.voice.platform=${VOICE_PLATFORM:simulated}
# Shared secret (32+ characters) the voice platform signs tool and webhook requests with.
# Empty: /api/voice/hooks/** refuses every request.
app.voice.hmac-secret=${VOICE_HMAC_SECRET:}
# AI calls are only placed between these times, Indian time (decided 17 Nov 2026: 9 AM to 6 PM). A campaign's own
# hours can only narrow them. Staff desk hours (app.voice.desk-open / desk-close) are separate.
app.voice.window-start=${VOICE_WINDOW_START:09:00}
app.voice.window-end=${VOICE_WINDOW_END:18:00}

# ---- Our own AI voice: the brain and the speech engine (voice-engine/) ----
# Brain for new conversations: SIMULATED (rules), LOCAL (open model via Ollama/vLLM) or CLAUDE (Anthropic API).
app.voice.ai.brain=${AI_BRAIN:SIMULATED}
app.voice.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.voice.ai.anthropic-model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
app.voice.ai.local-url=${LOCAL_LLM_URL:http://localhost:11434}
app.voice.ai.local-model=${LOCAL_LLM_MODEL:qwen2.5:3b}
app.voice.ai.speech-url=${SPEECH_URL:http://localhost:8090}
app.voice.ai.speech-token=${SPEECH_TOKEN:}
app.voice.max-per-number-per-day=2
app.voice.min-gap-minutes=120
app.voice.dnd-ttl-hours=24
# Transcripts and recordings older than this are deleted.
# Never fewer than 120: the CRM refuses to start with less.
app.voice.retention-days=${VOICE_RETENTION_DAYS:365}
# Call recordings: one audio file per call in this folder on the CRM server. Only the admin and staff given
# "Can listen to call recordings" can play them. Include the folder in backups.
app.voice.recordings-dir=${VOICE_RECORDINGS_DIR:data/recordings}
# Staff desk number for live transfers (+91...). Empty: every handoff becomes a callback task.
app.voice.desk-transfer-number=${VOICE_DESK_NUMBER:}
# Plivo as the phone line (app.voice.platform=plivo); our speech engine holds the conversation.
app.voice.plivo.auth-id=${PLIVO_AUTH_ID:}
app.voice.plivo.auth-token=${PLIVO_AUTH_TOKEN:}
app.voice.plivo.from-number=${PLIVO_FROM_NUMBER:}
app.voice.plivo.public-url=${PLIVO_PUBLIC_URL:}
app.voice.plivo.engine-url=${PLIVO_ENGINE_URL:}
# Plivo's API. Only changed for a rehearsal on one machine (voice-engine/rehearse.py, its pretend Plivo).
app.voice.plivo.api-base=${PLIVO_API_BASE:https://api.plivo.com/v1}
app.voice.desk-open=${VOICE_DESK_OPEN:09:30}
app.voice.desk-close=${VOICE_DESK_CLOSE:18:30}
# Rough all-in cost of one connected minute, and the monthly amount at which the admin is warned.
app.voice.cost-per-minute-inr=${VOICE_COST_PER_MINUTE_INR:15}
app.voice.monthly-cap-inr=${VOICE_MONTHLY_CAP_INR:60000}
