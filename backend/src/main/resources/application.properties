spring.application.name=crm-backend
# Your consultancy's name, shown on receipts and in WhatsApp/SMS messages.
app.org-name=${ORG_NAME:Counselling CRM}
# Local development: values in backend/.env (git-ignored) are loaded if the file exists.
# In production, set real environment variables instead.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mbbs_crm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Jackson 3 rejects absent primitive fields by default; treat an omitted boolean as false instead.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ---- Auth ----
# JWT_SECRET has no default on purpose: the app refuses to start without one (min 32 bytes).
app.jwt.secret=${JWT_SECRET:}
# Sessions end after 3 minutes without activity. The browser renews the session about once a minute while
# the person is active (see frontend/src/lib/use-idle.tsx, which must use the same limit); a closed tab or a
# sleeping laptop simply lets the refresh token run out. Keep access-ttl no longer than refresh-ttl.
app.jwt.access-ttl=${SESSION_IDLE_TIMEOUT:3m}
app.jwt.refresh-ttl=${SESSION_IDLE_TIMEOUT:3m}
app.cookie.secure=${COOKIE_SECURE:true}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Super Admin}
# The first admin's mobile number: staff sign in with their number and a one-time code.
app.bootstrap.admin-phone=${ADMIN_PHONE:}
# TEMPORARY, until WhatsApp/SMS is connected: show the sign-in code on the login page instead of sending it.
# While true, anyone who knows a staff mobile number can sign in. Never true on a public site.
app.otp.show-on-screen=${OTP_SHOW_ON_SCREEN:false}

# ---- Ops ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---- Document storage ----
# Cloudflare R2 (S3-compatible). Leave empty to use the local folder below (development only).
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.local-dir=${STORAGE_LOCAL_DIR:data/uploads}

# ---- AI voice calling agent (spec section 18) ----
# With no platform connected ("simulated") everything works except that no phone rings.
app.voice.enabled=${VOICE_ENABLED:true}
# Name of the installed VoicePlatformClient adapter to use; see docs/voice-agent.md.
app.voice.platform=${VOICE_PLATFORM:simulated}
# Shared secret (32+ characters) the voice platform signs tool and webhook requests with.
# Empty: /api/voice/hooks/** refuses every request.
app.voice.hmac-secret=${VOICE_HMAC_SECRET:}
# Calls are only placed between these times, Indian time. Confirm the legal window before going live.
app.voice.window-start=${VOICE_WINDOW_START:09:00}
app.voice.window-end=${VOICE_WINDOW_END:20:00}
app.voice.max-per-number-per-day=2
app.voice.min-gap-minutes=120
app.voice.dnd-ttl-hours=24
# Transcripts and recordings older than this are deleted.
app.voice.retention-days=${VOICE_RETENTION_DAYS:365}
# Counsellor desk number for live transfers (+91...). Empty: every handoff becomes a callback task.
app.voice.desk-transfer-number=${VOICE_DESK_NUMBER:}
app.voice.desk-open=${VOICE_DESK_OPEN:09:30}
app.voice.desk-close=${VOICE_DESK_CLOSE:18:30}
# Rough all-in cost of one connected minute, and the monthly amount at which the admin is warned.
app.voice.cost-per-minute-inr=${VOICE_COST_PER_MINUTE_INR:15}
app.voice.monthly-cap-inr=${VOICE_MONTHLY_CAP_INR:60000}
