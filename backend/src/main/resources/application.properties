spring.application.name=crm-backend
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mbbs_crm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Jackson 3 rejects absent primitive fields by default; treat an omitted boolean as false instead.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ---- Auth ----
# JWT_SECRET has no default on purpose: the app refuses to start without one (min 32 bytes).
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
app.cookie.secure=${COOKIE_SECURE:true}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Super Admin}

# ---- Ops ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
