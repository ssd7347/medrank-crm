# The demo copy of the CRM, for showing it to a client. NEVER use this file for a real installation.
# The database lives in memory: it is empty at every start and everything is lost when the server stops.
# No phone rings (simulated platform), no paid AI is reachable, and the sign-in code is shown on the screen.
spring.datasource.url=jdbc:h2:mem:crmdemo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
server.port=8094
# New random secrets at every start: nothing here is a real secret.
app.jwt.secret=${random.uuid}${random.uuid}
app.voice.hmac-secret=${random.uuid}${random.uuid}
app.cookie.secure=false
app.otp.show-on-screen=true
app.bootstrap.admin-name=Demo Admin
app.bootstrap.admin-email=admin@demo.local
app.bootstrap.admin-password=${random.uuid}
app.bootstrap.admin-phone=9000000000
app.features=ALL
app.alerts.scheduling-enabled=true
# Simulated calls only, whatever backend/.env says: no Plivo, no Claude, no desk transfer.
app.voice.enabled=true
app.voice.platform=simulated
app.voice.ai.anthropic-api-key=
app.voice.plivo.auth-id=
app.voice.plivo.auth-token=
app.voice.plivo.from-number=
app.voice.desk-transfer-number=
